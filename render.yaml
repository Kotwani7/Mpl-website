services:
  - type: web
    name: mpl-website
    runtime: node
    plan: free
    region: singapore
    rootDir: MPL-Website/mpl-website
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: MPL_DATA_DIR
        value: /tmp/mpl-data
      - key: MPL_UPLOADS_DIR
        value: /tmp/mpl-uploads
